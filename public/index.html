<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Premium Chat</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background-color: #0d0304;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle at center, #ef0c1822 0%, #0d0304 80%);
        }

        .card {
            background: #140507;
            border: 1px solid #ef0c1844;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(239, 12, 24, 0.2);
            width: 360px;
            text-align: center;
        }

        .hidden { display: none; }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #0d0304;
            border: 1px solid #ef0c18;
            color: white;
            border-radius: 4px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #ef0c18;
            color: white;
            border: none;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover { background: #b30812; }

        .chat-box {
            height: 220px;
            border: 1px solid #ef0c1844;
            background: #0d0304;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            margin: 10px 0;
            border-radius: 4px;
        }

        .chat-msg {
            margin-bottom: 8px;
            font-size: 13px;
            word-wrap: break-word;
        }

        .chat-msg span {
            color: #ef0c18;
            font-weight: bold;
        }

        .tab-btn {
            width: 48%;
            display: inline-block;
            background: #22080a;
            border: 1px solid #ef0c18;
        }

        .tab-btn.active { background: #ef0c18; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- 1. ENTER NAME ONLY PAGE -->
    <div id="login-card" class="card">
        <h2 style="color: #ef0c18; margin-bottom: 5px;">VOID CHAT</h2>
        <p style="font-size: 12px; color: #aaa;">Maglagay lang ng pangalan para makapasok</p>
        
        <input type="text" id="usernameInput" placeholder="I-type ang iyong Pangalan..." required>
        <button onclick="enterChat()">Pumasok sa Chat</button>
    </div>

    <!-- 2. MAIN CHAT PANEL -->
    <div id="chat-card" class="card hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span id="userDisplay" style="color: #ef0c18; font-weight: bold;">User</span>
            <button onclick="location.reload()" style="width: auto; padding: 4px 10px; font-size: 11px; margin: 0; background: #333;">Palitan Name</button>
        </div>

        <!-- Chat Tabs -->
        <div style="margin: 15px 0 5px 0;">
            <button class="tab-btn active" id="btnGlobal" onclick="switchTab('global')">Community</button>
            <button class="tab-btn" id="btnPrivate" onclick="switchTab('private')">Private Chat</button>
        </div>

        <!-- Private Chat Target Name -->
        <div id="privateTargetDiv" class="hidden">
            <input type="text" id="targetUser" placeholder="Pangalan ng i-pi-PM..." onchange="loadPrivateChat()">
        </div>

        <!-- Messages Display -->
        <div class="chat-box" id="chatDisplay"></div>

        <!-- Message Input -->
        <input type="text" id="chatMsgInput" placeholder="I-type ang mensahe...">
        <button onclick="sendMessage()">Ipadala</button>
    </div>

    <script>
        // Palitan ang URL na ito ng iyong sariling Firebase Realtime Database URL
        const firebaseConfig = {
            databaseURL: "https://YOUR-DATABASE-NAME-default-rtdb.firebaseio.com/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let currentUser = "";
        let currentTab = 'global';

        // ENTER SYSTEM
        function enterChat() {
            const name = document.getElementById('usernameInput').value.trim();
            if (!name) {
                alert("Maglagay muna ng pangalan!");
                return;
            }
            currentUser = name;
            document.getElementById('userDisplay').innerText = "@" + currentUser;
            document.getElementById('login-card').classList.add('hidden');
            document.getElementById('chat-card').classList.remove('hidden');
            
            loadGlobalChat();
        }

        // TAB SYSTEM
        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('chatDisplay').innerHTML = "";
            if (tab === 'global') {
                document.getElementById('btnGlobal').classList.add('active');
                document.getElementById('btnPrivate').classList.remove('active');
                document.getElementById('privateTargetDiv').classList.add('hidden');
                loadGlobalChat();
            } else {
                document.getElementById('btnPrivate').classList.add('active');
                document.getElementById('btnGlobal').classList.remove('active');
                document.getElementById('privateTargetDiv').classList.remove('hidden');
            }
        }

        // LOAD COMMUNITY CHAT
        function loadGlobalChat() {
            db.ref('global_chat').limitToLast(30).on('value', snapshot => {
                const box = document.getElementById('chatDisplay');
                box.innerHTML = "";
                snapshot.forEach(child => {
                    const data = child.val();
                    box.innerHTML += `<div class="chat-msg"><span>${data.sender}:</span> ${data.text}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        // LOAD PRIVATE CHAT
        function loadPrivateChat() {
            const target = document.getElementById('targetUser').value.trim();
            if (!target) return;

            const chatRoomId = [currentUser, target].sort().join("_");
            db.ref('private_chats/' + chatRoomId).limitToLast(30).on('value', snapshot => {
                const box = document.getElementById('chatDisplay');
                box.innerHTML = "";
                snapshot.forEach(child => {
                    const data = child.val();
                    box.innerHTML += `<div class="chat-msg"><span>${data.sender}:</span> ${data.text}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        // SEND MESSAGE
        function sendMessage() {
            const input = document.getElementById('chatMsgInput');
            const text = input.value.trim();
            if (!text) return;

            if (currentTab === 'global') {
                db.ref('global_chat').push({
                    sender: currentUser,
                    text: text
                });
            } else {
                const target = document.getElementById('targetUser').value.trim();
                if (!target) {
                    alert("Ilagay muna ang pangalan ng kakausapin!");
                    return;
                }
                const chatRoomId = [currentUser, target].sort().join("_");
                db.ref('private_chats/' + chatRoomId).push({
                    sender: currentUser,
                    text: text
                });
            }
            input.value = "";
        }
    </script>
</body>
  </html>
