<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat & Community App</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
        
        body {
            background-color: #050203;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            user-select: none;
        }

        .hidden { display: none !important; }

        /* AUTH CARD */
        .auth-card {
            background: linear-gradient(180deg, #1f080a 0%, #120304 100%);
            border: 1px solid #3d0d12;
            padding: 30px 20px;
            border-radius: 28px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(220, 38, 38, 0.15);
        }

        .logo-box {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            border-radius: 16px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.4);
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            border: 3px solid #ffffff;
            border-radius: 4px;
            transform: rotate(45deg);
        }

        .auth-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .auth-sub { font-size: 13px; color: #a18a8c; margin-bottom: 24px; }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 12px;
            background: #140506;
            border: 1px solid #380e12;
            color: #ffffff;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
        }

        .input-field:focus { border-color: #dc2626; }

        .btn-red {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #dc2626 0%, #991b1b 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.3);
        }

        .auth-switch {
            font-size: 13px;
            color: #f87171;
            margin-top: 20px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        /* MAIN APP PANEL */
        .app-card {
            background: #0f0304;
            border: 1px solid #29080b;
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            padding: 16px;
            min-height: 650px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* PROFILE HEADER */
        .profile-header {
            background: #170507;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            margin-bottom: 16px;
            border: 1px solid #330a0e;
        }

        .cover-area {
            height: 90px;
            background: #24080b;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .btn-edit-cover {
            position: absolute;
            right: 12px;
            bottom: 12px;
            background: rgba(15, 3, 4, 0.8);
            border: 1px solid #450a0a;
            color: #ffffff;
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .user-info-bar {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .avatar-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-box {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: #2b080c;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #450a0a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }

        .username-text { font-size: 16px; font-weight: 700; color: #ffffff; }
        .status-dot { font-size: 12px; color: #22c55e; margin-top: 2px; }

        .btn-signout {
            background: #2b080c;
            border: 1px solid #7f1d1d;
            color: #f87171;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* NAVIGATION TABS */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 16px;
        }

        .tab-item {
            background: #170507;
            border: 1px solid #2d090c;
            color: #a18a8c;
            padding: 10px 0;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .tab-item.active {
            background: #7f1d1d;
            border-color: #dc2626;
            color: #ffffff;
        }

        /* MAIN CONTENT DISPLAY AREA */
        .content-body {
            background: #0a0203;
            border: 1px solid #240608;
            border-radius: 18px;
            padding: 16px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* CHAT STYLES */
        .chat-list {
            height: 320px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px;
        }

        .chat-bubble-container {
            position: relative;
            max-width: 85%;
            align-self: flex-start;
        }

        .chat-bubble {
            background: #1c0507;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13px;
            border: 1px solid #360a0e;
            position: relative;
            cursor: pointer;
        }

        .chat-bubble .sender { color: #f87171; font-weight: 600; margin-bottom: 2px; font-size: 11px; }

        .chat-input-bar {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .chat-input-bar input {
            flex-grow: 1;
            background: #140506;
            border: 1px solid #330a0e;
            color: white;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
        }

        .chat-input-bar button {
            background: #dc2626;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        /* COMMUNITY / FB FEED STYLES */
        .community-feed {
            height: 380px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-right: 4px;
        }

        .post-creator {
            background: #170507;
            border: 1px solid #330a0e;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .post-creator textarea {
            width: 100%;
            height: 50px;
            background: transparent;
            border: none;
            color: white;
            resize: none;
            font-size: 13px;
            outline: none;
        }

        .post-creator-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            border-top: 1px solid #29080b;
            padding-top: 8px;
        }

        .media-btn {
            background: #2b080c;
            border: 1px solid #570d13;
            color: #f87171;
            font-size: 11px;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-post {
            background: #dc2626;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* POST CARD */
        .post-card {
            background: #140406;
            border: 1px solid #2d090c;
            border-radius: 14px;
            padding: 12px;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .post-author { font-size: 13px; font-weight: 700; color: #f87171; }
        .post-time { font-size: 10px; color: #7f1d1d; }

        .post-text { font-size: 13px; color: #ffffff; margin-bottom: 10px; line-height: 1.4; }

        .post-media {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #29080b;
        }

        /* FB REACT BAR */
        .post-react-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid #240608;
            padding-top: 8px;
            position: relative;
        }

        .react-btn-container {
            position: relative;
            display: inline-block;
        }

        .btn-react-trigger {
            background: none;
            border: none;
            color: #a18a8c;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .fb-react-popover {
            position: absolute;
            bottom: 25px;
            left: 0;
            background: #2b080c;
            border: 1px solid #7f1d1d;
            border-radius: 20px;
            padding: 4px 8px;
            display: none;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            z-index: 50;
        }

        .fb-react-popover span {
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .fb-react-popover span:hover { transform: scale(1.3); }

        .react-count-badge {
            font-size: 11px;
            color: #f87171;
        }

        /* REACTION POPUP FOR CHAT */
        .reaction-menu {
            position: absolute;
            top: -45px;
            left: 0;
            background: #2b080c;
            border: 1px solid #7f1d1d;
            border-radius: 20px;
            padding: 4px 8px;
            display: flex;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            z-index: 100;
        }

        .reaction-emoji { font-size: 18px; cursor: pointer; transition: transform 0.1s; }
        .reaction-emoji:hover { transform: scale(1.3); }

        .reaction-badge {
            position: absolute;
            bottom: -10px;
            right: 8px;
            background: #2b080c;
            border: 1px solid #570d13;
            border-radius: 12px;
            padding: 1px 5px;
            font-size: 12px;
        }

        .placeholder-text {
            color: #7f1d1d;
            font-size: 13px;
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div id="authScreen" class="auth-card">
        <div class="logo-box">
            <div class="logo-icon"></div>
        </div>
        <h2 class="auth-title" id="authTitle">Join Us Today</h2>
        <p class="auth-sub" id="authSub">Fill in the details to get started with your account</p>

        <input type="text" id="authUsername" class="input-field" placeholder="Username">
        <input type="password" id="authPassword" class="input-field" placeholder="Password">

        <button class="btn-red" id="authBtn" onclick="handleAuth()">Create Account</button>
        <div>
            <a class="auth-switch" id="authToggle" onclick="toggleAuthMode()">Already have an account? Sign In</a>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="appScreen" class="app-card hidden">
        
        <div class="profile-header">
            <div class="cover-area" id="coverDisplay">
                <button class="btn-edit-cover" onclick="document.getElementById('coverInput').click()">Edit Cover</button>
                <input type="file" id="coverInput" accept="image/*" class="hidden" onchange="uploadImage(event, 'cover')">
            </div>
            <div class="user-info-bar">
                <div class="avatar-container">
                    <div class="avatar-box" onclick="document.getElementById('pfpInput').click()">
                        <img id="pfpDisplay" src="https://via.placeholder.com/48/2b080c/ffffff?text=Avatar">
                        <input type="file" id="pfpInput" accept="image/*" class="hidden" onchange="uploadImage(event, 'pfp')">
                    </div>
                    <div>
                        <div class="username-text" id="displayUsername">username</div>
                        <div class="status-dot">● Active</div>
                    </div>
                </div>
                <button class="btn-signout" onclick="signOut()">Sign Out</button>
            </div>
        </div>

        <div class="nav-grid">
            <button class="tab-item active" id="tab-community" onclick="switchTab('community')">Community</button>
            <button class="tab-item" id="tab-live" onclick="switchTab('live')">Live Chat</button>
            <button class="tab-item" id="tab-private" onclick="switchTab('private')">Private Chat</button>
            <button class="tab-item" id="tab-requests" onclick="switchTab('requests')">Requests</button>
        </div>

        <div class="content-body">
            
            <!-- COMMUNITY FEED -->
            <div id="communityView" class="community-feed">
                <div class="post-creator">
                    <textarea id="postContent" placeholder="What's on your mind?"></textarea>
                    <div id="mediaPreview" style="margin-bottom: 8px;"></div>
                    <div class="post-creator-actions">
                        <button class="media-btn" onclick="document.getElementById('postMediaInput').click()">+ Photo/Video</button>
                        <input type="file" id="postMediaInput" accept="image/*,video/*" class="hidden" onchange="handleMediaSelect(event)">
                        <button class="btn-post" onclick="createPost()">Post</button>
                    </div>
                </div>
                <div id="feedList"></div>
            </div>

            <!-- CHAT VIEW -->
            <div id="chatView" class="hidden">
                <div id="privateTargetBox" class="hidden" style="margin-bottom: 10px;">
                    <input type="text" id="privateTargetUser" class="input-field" placeholder="Target Username..." onchange="loadMessages()">
                </div>
                <div class="chat-list" id="chatMessages"></div>
            </div>

            <!-- REQUESTS VIEW -->
            <div id="requestsView" class="hidden">
                <p class="placeholder-text">No pending friend requests.</p>
            </div>

            <!-- CHAT INPUT BAR -->
            <div class="chat-input-bar hidden" id="inputBar">
                <input type="text" id="messageInput" placeholder="Write a message..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">Send</button>
            </div>

        </div>

    </div>

    <script>
        let isSignUp = true;
        let currentUser = "";
        let currentTab = "community";
        let pendingMedia = null;
        let pendingMediaType = "";
        let longPressTimer = null;
        let activeReactionMenu = null;

        const STORAGE_USERS = "app_users_red";
        const STORAGE_MESSAGES = "app_messages_red";
        const STORAGE_POSTS = "app_posts_red";

        // MOCK DATA INITIALIZATION
        function initData() {
            if (!localStorage.getItem(STORAGE_POSTS)) {
                const initialPosts = [
                    {
                        id: 101,
                        author: "Ph.YuSh1n",
                        text: "Welcome to our Red & Black Community! Feel free to share images and videos here.",
                        media: "",
                        mediaType: "",
                        time: "Just now",
                        reacts: { "👍": ["0xr1su"], "❤️": ["Ph.YuSh1n"] }
                    }
                ];
                localStorage.setItem(STORAGE_POSTS, JSON.stringify(initialPosts));
            }

            if (!localStorage.getItem(STORAGE_MESSAGES)) {
                const initialMsgs = [
                    { id: 1, tab: "live", sender: "Ph.YuSh1n", text: "ghe out muna ako later kuna update css nito", reaction: "" },
                    { id: 2, tab: "live", sender: "Ph.YuSh1n", text: "ako dev nito", reaction: "" },
                    { id: 3, tab: "live", sender: "0xr1su", text: "ik haha nasa ws ako", reaction: "❤️" },
                    { id: 4, tab: "live", sender: "Ph.YuSh1n", text: "ah ghe lang", reaction: "" },
                    { id: 5, tab: "live", sender: "Ph.YuSh1n", text: "gising", reaction: "😆" }
                ];
                localStorage.setItem(STORAGE_MESSAGES, JSON.stringify(initialMsgs));
            }
        }
        initData();

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('authTitle').innerText = isSignUp ? "Join Us Today" : "Welcome Back";
            document.getElementById('authSub').innerText = isSignUp ? "Fill in the details to get started with your account" : "Enter your credentials to access your account";
            document.getElementById('authBtn').innerText = isSignUp ? "Create Account" : "Sign In";
            document.getElementById('authToggle').innerText = isSignUp ? "Already have an account? Sign In" : "Don't have an account? Sign Up";
        }

        function handleAuth() {
            const user = document.getElementById('authUsername').value.trim();
            const pass = document.getElementById('authPassword').value.trim();

            if (!user || !pass) return alert("Please fill in all fields!");

            let users = JSON.parse(localStorage.getItem(STORAGE_USERS) || "{}");

            if (isSignUp) {
                if (users[user]) {
                    alert("Username already exists!");
                } else {
                    users[user] = { password: pass, pfp: "", cover: "" };
                    localStorage.setItem(STORAGE_USERS, JSON.stringify(users));
                    loginSuccess(user);
                }
            } else {
                if (users[user] && users[user].password === pass) {
                    loginSuccess(user);
                } else {
                    alert("Invalid Username or Password!");
                }
            }
        }

        function loginSuccess(user) {
            currentUser = user;
            document.getElementById('displayUsername').innerText = currentUser;
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            loadUserProfile();
            switchTab('community');
        }

        function signOut() { location.reload(); }

        function switchTab(tab) {
            currentTab = tab;
            const tabs = ['community', 'live', 'private', 'requests'];
            tabs.forEach(t => document.getElementById('tab-' + t).classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');

            document.getElementById('communityView').classList.add('hidden');
            document.getElementById('chatView').classList.add('hidden');
            document.getElementById('requestsView').classList.add('hidden');
            document.getElementById('inputBar').classList.add('hidden');
            document.getElementById('privateTargetBox').classList.add('hidden');

            if (tab === 'community') {
                document.getElementById('communityView').classList.remove('hidden');
                loadPosts();
            } else if (tab === 'live' || tab === 'private') {
                document.getElementById('chatView').classList.remove('hidden');
                document.getElementById('inputBar').classList.remove('hidden');
                if (tab === 'private') {
                    document.getElementById('privateTargetBox').classList.remove('hidden');
                }
                loadMessages();
            } else if (tab === 'requests') {
                document.getElementById('requestsView').classList.remove('hidden');
            }
        }

        // PROFILE PICTURE & COVER PHOTO
        function uploadImage(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imgData = e.target.result;
                let users = JSON.parse(localStorage.getItem(STORAGE_USERS) || "{}");
                if (!users[currentUser]) users[currentUser] = {};

                if (type === 'cover') {
                    document.getElementById('coverDisplay').style.backgroundImage = `url(${imgData})`;
                    users[currentUser].cover = imgData;
                } else {
                    document.getElementById('pfpDisplay').src = imgData;
                    users[currentUser].pfp = imgData;
                }
                localStorage.setItem(STORAGE_USERS, JSON.stringify(users));
            };
            reader.readAsDataURL(file);
        }

        function loadUserProfile() {
            let users = JSON.parse(localStorage.getItem(STORAGE_USERS) || "{}");
            const userData = users[currentUser];
            if (userData) {
                if (userData.pfp) document.getElementById('pfpDisplay').src = userData.pfp;
                if (userData.cover) document.getElementById('coverDisplay').style.backgroundImage = `url(${userData.cover})`;
            }
        }

        // COMMUNITY POST SYSTEM
        function handleMediaSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            pendingMediaType = file.type.startsWith('video') ? 'video' : 'image';
            const reader = new FileReader();
            reader.onload = function(evt) {
                pendingMedia = evt.target.result;
                const prev = document.getElementById('mediaPreview');
                if (pendingMediaType === 'image') {
                    prev.innerHTML = `<img src="${pendingMedia}" style="max-height:80px; border-radius:8px;">`;
                } else {
                    prev.innerHTML = `<video src="${pendingMedia}" style="max-height:80px; border-radius:8px;" controls></video>`;
                }
            };
            reader.readAsDataURL(file);
        }

        function createPost() {
            const text = document.getElementById('postContent').value.trim();
            if (!text && !pendingMedia) return alert("Write something or upload a photo/video!");

            let posts = JSON.parse(localStorage.getItem(STORAGE_POSTS) || "[]");
            const newPost = {
                id: Date.now(),
                author: currentUser,
                text: text,
                media: pendingMedia || "",
                mediaType: pendingMediaType || "",
                time: "Just now",
                reacts: {}
            };

            posts.unshift(newPost);
            localStorage.setItem(STORAGE_POSTS, JSON.stringify(posts));

            // Reset Input
            document.getElementById('postContent').value = "";
            document.getElementById('mediaPreview').innerHTML = "";
            pendingMedia = null;
            pendingMediaType = "";

            loadPosts();
        }

        function loadPosts() {
            const feed = document.getElementById('feedList');
            feed.innerHTML = "";
            let posts = JSON.parse(localStorage.getItem(STORAGE_POSTS) || "[]");

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';

                let mediaHtml = '';
                if (post.media) {
                    if (post.mediaType === 'image') {
                        mediaHtml = `<img src="${post.media}" class="post-media">`;
                    } else if (post.mediaType === 'video') {
                        mediaHtml = `<video src="${post.media}" class="post-media" controls></video>`;
                    }
                }

                // Calculate React Counts
                let totalReacts = 0;
                let userReact = "React";
                const reactionsList = post.reacts || {};
                
                for (let r in reactionsList) {
                    totalReacts += reactionsList[r].length;
                    if (reactionsList[r].includes(currentUser)) userReact = r;
                }

                card.innerHTML = `
                    <div class="post-header">
                        <div>
                            <div class="post-author">${post.author}</div>
                            <div class="post-time">${post.time}</div>
                        </div>
                    </div>
                    ${post.text ? `<div class="post-text">${post.text}</div>` : ''}
                    ${mediaHtml}
                    <div class="post-react-bar">
                        <div class="react-btn-container" onmouseleave="hideFbReacts(${post.id})">
                            <button class="btn-react-trigger" onclick="toggleFbReactMenu(${post.id})">${userReact}</button>
                            <div class="fb-react-popover" id="popover-${post.id}">
                                <span onclick="addPostReact(${post.id}, '👍')">👍</span>
                                <span onclick="addPostReact(${post.id}, '❤️')">❤️</span>
                                <span onclick="addPostReact(${post.id}, '😆')">😆</span>
                                <span onclick="addPostReact(${post.id}, '😢')">😢</span>
                                <span onclick="addPostReact(${post.id}, '😡')">😡</span>
                            </div>
                        </div>
                        <span class="react-count-badge">${totalReacts > 0 ? totalReacts + ' Reactions' : ''}</span>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        function toggleFbReactMenu(postId) {
            const popover = document.getElementById(`popover-${postId}`);
            popover.style.display = popover.style.display === 'flex' ? 'none' : 'flex';
        }

        function hideFbReacts(postId) {
            const popover = document.getElementById(`popover-${postId}`);
            if (popover) popover.style.display = 'none';
        }

        function addPostReact(postId, emoji) {
            let posts = JSON.parse(localStorage.getItem(STORAGE_POSTS) || "[]");
            const idx = posts.findIndex(p => p.id === postId);
            if (idx !== -1) {
                if (!posts[idx].reacts) posts[idx].reacts = {};

                // Remove user's old reaction if any
                for (let r in posts[idx].reacts) {
                    posts[idx].reacts[r] = posts[idx].reacts[r].filter(u => u !== currentUser);
                }

                if (!posts[idx].reacts[emoji]) posts[idx].reacts[emoji] = [];
                posts[idx].reacts[emoji].push(currentUser);

                localStorage.setItem(STORAGE_POSTS, JSON.stringify(posts));
            }
            loadPosts();
        }

        // MESSAGING SYSTEM
        function loadMessages() {
            closeReactionMenu();
            const box = document.getElementById('chatMessages');
            box.innerHTML = "";

            let allMsgs = JSON.parse(localStorage.getItem(STORAGE_MESSAGES) || "[]");
            let filteredMsgs = [];

            if (currentTab === 'private') {
                const target = document.getElementById('privateTargetUser').value.trim();
                const roomId = [currentUser, target].sort().join("_");
                filteredMsgs = allMsgs.filter(m => m.tab === 'private' && m.roomId === roomId);
            } else {
                filteredMsgs = allMsgs.filter(m => m.tab === currentTab);
            }

            filteredMsgs.forEach(msg => {
                const container = document.createElement('div');
                container.className = 'chat-bubble-container';

                const bubble = document.createElement('div');
                bubble.className = 'chat-bubble';
                bubble.innerHTML = `
                    <div class="sender">${msg.sender}</div>
                    <div>${msg.text}</div>
                    ${msg.reaction ? `<div class="reaction-badge">${msg.reaction}</div>` : ''}
                `;

                bubble.addEventListener('touchstart', (e) => startLongPress(e, msg.id, container));
                bubble.addEventListener('touchend', endLongPress);
                bubble.addEventListener('mousedown', (e) => startLongPress(e, msg.id, container));
                bubble.addEventListener('mouseup', endLongPress);
                bubble.addEventListener('mouseleave', endLongPress);

                container.appendChild(bubble);
                box.appendChild(container);
            });

            box.scrollTop = box.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            let allMsgs = JSON.parse(localStorage.getItem(STORAGE_MESSAGES) || "[]");
            let newMsg = {
                id: Date.now(),
                tab: currentTab,
                sender: currentUser,
                text: text,
                reaction: ""
            };

            if (currentTab === 'private') {
                const target = document.getElementById('privateTargetUser').value.trim();
                if (!target) return alert("Enter target username first!");
                newMsg.roomId = [currentUser, target].sort().join("_");
            }

            allMsgs.push(newMsg);
            localStorage.setItem(STORAGE_MESSAGES, JSON.stringify(allMsgs));
            input.value = "";
            loadMessages();
        }

        // LONG PRESS REACTION FOR CHAT
        function startLongPress(event, msgId, container) {
            longPressTimer = setTimeout(() => { showReactionMenu(msgId, container); }, 500);
        }

        function endLongPress() {
            if (longPressTimer) clearTimeout(longPressTimer);
        }

        function showReactionMenu(msgId, container) {
            closeReactionMenu();
            const menu = document.createElement('div');
            menu.className = 'reaction-menu';
            
            const emojis = ['😆', '😢', '😡', '👍', '❤️'];
            emojis.forEach(emoji => {
                const span = document.createElement('span');
                span.className = 'reaction-emoji';
                span.innerText = emoji;
                span.onclick = () => setReaction(msgId, emoji);
                menu.appendChild(span);
            });

            container.appendChild(menu);
            activeReactionMenu = menu;
        }

        function closeReactionMenu() {
            if (activeReactionMenu) {
                activeReactionMenu.remove();
                activeReactionMenu = null;
            }
        }

        function setReaction(msgId, emoji) {
            let allMsgs = JSON.parse(localStorage.getItem(STORAGE_MESSAGES) || "[]");
            const index = allMsgs.findIndex(m => m.id === msgId);
            if (index !== -1) {
                allMsgs[index].reaction = allMsgs[index].reaction === emoji ? "" : emoji;
                localStorage.setItem(STORAGE_MESSAGES, JSON.stringify(allMsgs));
            }
            closeReactionMenu();
            loadMessages();
        }
    </script>
</body>
    </html>
